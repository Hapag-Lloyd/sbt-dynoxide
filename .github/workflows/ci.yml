name: CI

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          check-latest: true
      - name: Run scalafmt
        run: sbt 'scalafmtSbtCheck; +scalafmtCheckAll'

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sbt/setup-sbt@v1
      - uses: coursier/cache-action@v8
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          check-latest: true

      - name: Compile, publishLocal and run scripted tests (sbt 1.x + sbt 2.x)
        shell: bash
        run: sbt 'clean; +Test/compile; +publishLocal; +scripted'
